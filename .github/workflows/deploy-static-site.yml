name: Deploy Static Site

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the build artifact to deploy.
        required: false
        type: string
        default: dist
      tag_prefix:
        description: Prefix for deployment tags.
        required: false
        type: string
        default: v
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare account API token that may edit the site Worker.
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the export
        run: bash scripts/check-export.sh

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

      # Proves the live homepage comes from an export like this one. A shared chunk
      # can outlive a build, so this catches a broken deploy, not an older one.
      - name: Smoke test deployed build
        env:
          DOMAIN: ctrl-f.plus
        run: |
          set -euo pipefail
          MARKER=$(grep -o 'src="/_next/static/chunks/[^"]*"' dist/index.html | head -n 1)
          test -n "$MARKER"
          curl -fsS "https://$DOMAIN/" | grep -qF "$MARKER"

      - name: Tag deployment
        id: tag_deployment
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          git fetch --force --tags origin

          LATEST=$(git tag -l "${TAG_PREFIX}*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="${TAG_PREFIX}0.0.0"
          fi

          VERSION="${LATEST#"${TAG_PREFIX}"}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest tag '$LATEST' is not valid semver" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_TAG="${TAG_PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag '$NEW_TAG' already exists" >&2
            exit 1
          fi

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Print created tag
        run: echo "Created tag ${{ steps.tag_deployment.outputs.new_tag }}"
